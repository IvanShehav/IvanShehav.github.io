schema: spec-driven

context: |
  Static personal portfolio site for GitHub Pages (no build step, plain HTML/CSS/JS).
  Language: Russian primary, English secondary. Font: Montserrat.
  Never use long dashes in texts, never use the letter yo in Russian text.
  Never publish secrets, tokens, phone numbers, private repo contents or internal data.

# Project context (optional)
