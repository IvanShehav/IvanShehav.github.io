<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Иван Шехавцов, AI-продукты и автоматизация</title>
<meta name="description" content="Интерактивное резюме Ивана Шехавцова: проекты с живыми мини-демо, опыт, учеба и контакты. AI Product Manager и продуктовый аналитик.">
<meta name="theme-color" content="#0C1F36">
<meta property="og:title" content="Иван Шехавцов, AI-продукты и автоматизация">
<meta property="og:description" content="Проекты с живыми мини-демо, опыт, учеба и контакты.">

<link rel="icon" href="assets/favicon.png" type="image/png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="assets/styles.css?v=20261018g">
<script>
  /* тема до отрисовки, чтобы не мигало */
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
  })();
</script>
</head>
<body>
<a class="skip" href="#projects">Перейти к проектам</a>

<header class="nav" id="top">
  <div class="wrap nav-in">
    <a class="logo" href="#top" aria-label="Иван Шехавцов"><img class="logo-ava" src="assets/avatar.jpg" width="44" height="44" alt=""><span class="logo-name" id="logo-name">Иван Шехавцов</span></a>
    <nav class="nav-links" id="nav-links" aria-label="Разделы"></nav>
    <div class="nav-tools">
      <button class="tool" id="lang-btn" type="button"></button>
      <button class="tool icon" id="theme-btn" type="button" aria-label="Сменить тему"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 14.5A9 9 0 0 1 9.5 3a9 9 0 1 0 11.5 11.5z" fill="currentColor"/></svg></button>
      <button class="tool icon menu-btn" id="menu-btn" type="button" aria-label="Меню" aria-expanded="false" aria-controls="nav-links"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
    </div>
  </div>
</header>

<main>
  <section class="hero" id="hero">
    <div class="wrap hero-grid">
      <div class="hero-text">
        <h1 id="hero-name"></h1>
        <p class="hero-role" id="hero-role"></p>
        <p class="hero-lead" id="hero-lead"></p>
        <div class="hero-cta">
          <a class="btn primary" id="cta1" href="#projects"></a>
          <a class="btn" id="cta2" href="#contacts"></a>
          <a class="btn" id="cta3" href="assets/resume-ru.pdf" download></a>
        </div>
      </div>
      <div class="hero-stage">
        <figure class="photo-win">
          <div class="win-bar slim"><span class="dots"><i></i><i></i><i></i></span></div>
          <img id="hero-photo" src="assets/photo.jpg" width="900" height="900" alt="">
        </figure>
        <div class="mini-row">
        <a class="mini chat" id="mini-chat" href="#p-patient" data-open="patient" aria-label="Виртуальный пациент">
          <div class="mini-bar"><span id="mini-chat-title"></span></div>
          <div class="mini-chat-body" id="mini-chat-body" aria-hidden="true"></div>
        </a>
        <div class="mini train" id="mini-train">
          <div class="mini-bar"><span id="mini-train-title"></span><a class="mini-more" id="mini-train-open" href="#p-vr3d" data-open="vr3d"></a></div>
          <div class="train-stage">
            <canvas id="mini-train-cv" tabindex="0" aria-label="3D-модель электропоезда"></canvas>
            <div class="train-ctl"><button type="button" id="tz-in" aria-label="Приблизить">+</button><button type="button" id="tz-out" aria-label="Отдалить">&minus;</button></div>
          </div>
        </div>
        </div>
      </div>
    </div>
  </section>

  <section class="sec" id="about">
    <div class="wrap">
      <h2 id="about-title"></h2>
      <div class="about-grid">
        <div class="about-text" id="about-text"></div>
        <dl class="facts" id="about-facts"></dl>
      </div>
      <div class="goals" id="about-goals"></div>
      <div class="quals" id="about-quals"></div>
    </div>
  </section>

  <section class="sec alt" id="projects">
    <div class="wrap">
      <h2 id="projects-title"></h2>
      <p class="lead" id="projects-lead"></p>
      <div class="filters" id="filters" role="group"></div>
      <div class="sub" id="sub-main"></div>
      <div class="tiles" id="tiles"></div>
      <div class="sub" id="sub-more"></div>
      <div class="rows" id="rows"></div>
      <div class="sub" id="sub-other"></div>
      <ul class="other-list" id="other-list"></ul>
      <p class="empty" id="projects-empty" hidden></p>
    </div>
  </section>

  <section class="sec" id="experience">
    <div class="wrap">
      <h2 id="experience-title"></h2>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <section class="sec alt" id="education">
    <div class="wrap">
      <h2 id="education-title"></h2>
      <div class="edu" id="edu"></div>
    </div>
  </section>

  <section class="sec" id="skills">
    <div class="wrap">
      <h2 id="skills-title"></h2>
      <p class="lead" id="skills-lead"></p>
      <div class="skill-groups" id="skill-groups"></div>
      <div class="skill-used" id="skill-used" aria-live="polite"></div>
    </div>
  </section>

  <section class="sec alt" id="achievements">
    <div class="wrap">
      <h2 id="achievements-title"></h2>
      <ul class="ach" id="ach"></ul>
    </div>
  </section>

  <section class="sec contact" id="contacts">
    <div class="wrap">
      <h2 id="contacts-title"></h2>
      <p class="lead" id="contacts-lead"></p>
      <ul class="links" id="contact-links"></ul>
      <button class="btn" id="copy-btn" type="button"></button>
      <a class="btn" id="resume-btn" href="assets/resume-ru.pdf" download></a>
      <p class="fine" id="contacts-note"></p>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-in"><span id="footer-text"></span><a href="#top" id="to-top"></a></div>
</footer>

<dialog class="win" id="win" aria-labelledby="win-title">
  <div class="win-box" tabindex="-1" id="win-box">
    <div class="win-bar">
      <span class="dots"><i></i><i></i><i></i></span>
      <h2 class="win-title" id="win-title"></h2>
      <button class="tool icon" id="win-prev" type="button"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="tool icon" id="win-next" type="button"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="tool icon" id="win-close" type="button"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>
    <div class="win-body" id="win-body"></div>
  </div>
</dialog>
